<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>GBrackpool Satellite Tracker</title>
</head>
<body>
    <div id="info">GBrackpool's Satellite Tracker</div>
    <div class="card">
        <h2>Satellite Data</h2>
        <p id="sat-name"></p>
        <p id="sat-num"> </p>
        <div>
            <input type="range" id="orbitMins" name="orbitPath" min="93" max="5000" value="93" />
            <label for="orbitMins">Orbit Time (Minutes)</label>
            <span id="orbitValue"> 90</span>
            <div id="sat-position">
                <p>Latitude:</p>
                <p>Longtitude:</p>
                <p>Height:</p>
            </div>
        </div>
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
